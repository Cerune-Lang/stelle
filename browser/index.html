<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b35">
  <title>Stelle — 橋のない村</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/game.js" defer></script>
</head>
<body>
  <main class="game" id="game">
    <canvas id="map" width="1120" height="720" role="img" aria-label="橋のない村の2Dマップ。操作方法は右上のメニューから確認できます。">
      ブラウザでCanvasを有効にしてください。
    </canvas>

    <header class="hud">
      <div class="identity">
        <span class="chapter">CHAPTER 01 · 橋のない村</span>
        <h1>Stelle</h1>
      </div>
      <button class="menu-button" id="menu-toggle" type="button"
              aria-controls="menu" aria-expanded="false">☰ <span>メニュー</span></button>
    </header>

    <section class="dialogue" id="dialogue" aria-label="物語と会話" aria-live="polite" aria-atomic="true" hidden>
      <span class="dialogue-title">物語</span>
      <button id="dismiss-dialogue" class="dismiss" type="button" aria-label="メッセージを閉じる">×</button>
      <p id="story"></p>
    </section>

    <nav class="touch-controls" id="touch-controls" aria-label="画面上の操作ボタン" hidden>
      <div class="dpad">
        <button data-key="w" class="up" type="button" aria-label="上へ移動">↑</button>
        <button data-key="a" class="left" type="button" aria-label="左へ移動">←</button>
        <button data-key="s" class="down" type="button" aria-label="下へ移動">↓</button>
        <button data-key="d" class="right" type="button" aria-label="右へ移動">→</button>
      </div>
      <button data-key="e" class="action" type="button" aria-label="調べる、または話しかける">調べる</button>
    </nav>

    <div class="scrim" id="menu-scrim" hidden></div>
    <aside class="menu" id="menu" aria-label="ゲームメニュー" hidden>
      <div class="menu-head">
        <h2>メニュー</h2>
        <button id="menu-close" type="button" aria-label="メニューを閉じる">×</button>
      </div>
      <section>
        <h3>操作方法</h3>
        <dl class="shortcuts">
          <div><dt><kbd>↑ ↓ ← →</kbd> / <kbd>W A S D</kbd></dt><dd>移動</dd></div>
          <div><dt><kbd>E</kbd> / <kbd>Space</kbd></dt><dd>調べる・話す</dd></div>
          <div><dt><kbd>R</kbd></dt><dd>最初から（確認あり）</dd></div>
          <div><dt><kbd>Esc</kbd></dt><dd>メニューを閉じる</dd></div>
        </dl>
        <p class="help-note">リュナには開始地点で「調べる」を押すと話せます。現在地にあるものを調べる仕組みです。</p>
      </section>
      <section>
        <h3>直近の出来事</h3>
        <p id="journal" class="journal">村の記録を読み込み中…</p>
      </section>
      <section>
        <h3>主人公の見た目</h3>
        <label class="check"><input type="radio" name="hero-appearance" value="boy" checked> 黒髪の男の子</label>
        <label class="check"><input type="radio" name="hero-appearance" value="girl"> 黒髪の女の子</label>
        <p class="help-note">見た目のみ切り替えます。移動や物語の進行に影響しません。</p>
      </section>
      <section>
        <h3>オプション</h3>
        <label class="check"><input id="show-controls" type="checkbox">画面に操作ボタンを表示</label>
        <button class="option-button" id="fullscreen" type="button">全画面表示</button>
        <button class="option-button danger" id="restart" type="button">最初からやり直す</button>
      </section>
      <p class="menu-footnote">Stelle 2D プレビュー · 移動やイベントの処理は Cerune が担当しています。</p>
    </aside>

    <p id="error" class="error" role="alert" hidden></p>
  </main>
</body>
</html>
